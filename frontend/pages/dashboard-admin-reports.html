<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Admin Dashboard – Doctors Coat</title>
    <meta name="description" content="Admin dashboard for Doctors Coat platform management." />
    <link rel="icon" type="image/png" href="../images/DoctorsCoat.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/dashboard-shared.css" />
</head>
<body>
<script src="../js/theme.js"></script>

    <!-- SIDEBAR OVERLAY -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ── SIDEBAR ──────────────────────────────────────────────── -->
    <!-- ── SIDEBAR ─────────────────────────────────────────────── -->
<aside class="sidebar" id="dashSidebar">
    <div class="sidebar-top">
        <div class="sidebar-logo-icon">DC</div>
        <span class="sidebar-brand">Doctors Coat</span>
    </div>
    <div class="sidebar-role-badge" style="background:rgba(239,68,68,0.1);color:var(--danger);border:1px solid rgba(239,68,68,0.2)"><i class="fa-solid fa-shield-halved" style="margin-right:5px"></i>Admin Portal</div>
    <nav class="sidebar-nav">
        <span class="sidebar-section-label">Overview</span>
        <a href="dashboard-admin.html" class="nav-link"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        <a href="dashboard-admin-analytics.html" class="nav-link"><i class="fa-solid fa-chart-column"></i> Analytics</a>
        <span class="sidebar-section-label">Management</span>
        <a href="dashboard-admin-users.html" class="nav-link"><i class="fa-solid fa-users"></i> All Users</a>
        <a href="dashboard-admin-doctors.html" class="nav-link"><i class="fa-solid fa-user-doctor"></i> Doctors</a>
        <a href="dashboard-admin-hospitals.html" class="nav-link"><i class="fa-solid fa-hospital"></i> Hospitals</a>
        <span class="sidebar-section-label">Platform Data</span>
        <a href="dashboard-admin-jobs.html" class="nav-link"><i class="fa-solid fa-briefcase"></i> Job Listings</a>
        <a href="dashboard-admin-appointments.html" class="nav-link"><i class="fa-solid fa-calendar-check"></i> Appointments</a>
        <a href="dashboard-admin-reports.html" class="nav-link active"><i class="fa-solid fa-file-invoice"></i> Reports</a>
        <span class="sidebar-section-label">System</span>
        <a href="dashboard-admin-settings.html" class="nav-link"><i class="fa-solid fa-gear"></i> Settings</a>
    </nav>
    <div class="sidebar-divider"></div>
    <div class="sidebar-footer">
        <div class="sidebar-user">
            <div class="sidebar-avatar" style="background:var(--danger)" data-user-avatar>AD</div>
            <div>
                <div class="sidebar-uname" data-user-name>Admin</div>
                <div class="sidebar-urole">Super Admin</div>
            </div>
        </div>
        <button class="sidebar-logout" data-logout><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>
</aside>

    <!-- ── MAIN ─────────────────────────────────────────────────── -->
    <div class="main-wrap">

        <!-- TOP HEADER -->
        <header class="top-header">
        <div class="header-left">
            <button class="hamburger-mob" id="hamburgerMob"><i class="fa-solid fa-bars"></i></button>
            <div class="header-title">
                <h1>System Reports</h1>
                <p id="dashDate">Loading…</p>
            </div>
        </div>
        <div class="header-right">
            <div class="header-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search across platform…" />
            </div>
            <button class="header-icon-btn" title="Notifications">
                <i class="fa-solid fa-bell"></i>
                <div class="notif-dot"></div>
            </button>
            <div class="header-user-pill">
                <div class="sidebar-avatar" style="width:26px;height:26px;font-size:.68rem;background:var(--danger)" data-user-avatar>AD</div>
                <span data-user-name>Admin</span>
            </div>
        </div>
    </header>

        <!-- CONTENT -->
        <div class="content">
<div class="filter-bar">
    <label style="font-size:.78rem;color:var(--text2);display:flex;align-items:center;gap:6px">From
        <input type="date" id="reportFrom" style="background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text)" />
    </label>
    <label style="font-size:.78rem;color:var(--text2);display:flex;align-items:center;gap:6px">To
        <input type="date" id="reportTo" style="background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text)" />
    </label>
    <button class="btn-primary" style="padding:9px 16px" id="applyRangeBtn"><i class="fa-solid fa-filter"></i> Apply</button>
    <button class="btn-outline-sm" style="padding:9px 16px" id="exportCsvBtn"><i class="fa-solid fa-download"></i> Export CSV</button>
</div>
<div id="reportsContainer"></div>
</div>
</div>
<style>
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
@keyframes countUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.report-bar-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:.8rem; }
.report-bar-label { width:140px; flex-shrink:0; color:var(--text2); }
.report-bar-track { flex:1; height:10px; background:var(--bg3); border-radius:6px; overflow:hidden; }
.report-bar-fill { height:100%; background:var(--accent); border-radius:6px; }
.report-bar-count { width:40px; text-align:right; font-weight:600; color:var(--text); }
</style>

<script src="../js/api.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/dashboard-admin-reports.js"></script>
</body>
</html>
