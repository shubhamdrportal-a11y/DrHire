<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Hospital Dashboard – Doctors Coat</title>
    <meta name="description" content="Hospital dashboard for managing doctors, jobs, and applications." />
    <link rel="icon" type="image/png" href="../images/DoctorsCoat.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{--sidebar-w:220px;--header-h:60px;--bg:#0d1117;--bg2:#161b22;--bg3:#1c2230;--card:#1c2230;--border:rgba(255,255,255,.07);--accent:#0ea5e9;--grad:linear-gradient(135deg,#0ea5e9,#06b6d4);--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--purple:#8b5cf6}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;overflow-x:hidden}
        body.light-theme {--bg:#f8fafc; --bg2:#ffffff; --bg3:#f1f5f9; --card:#ffffff; --border:rgba(0,0,0,0.08); --text:#0f172a; --text2:#475569; --text3:#64748b;}
        .sidebar{width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:transform .3s;overflow-y:auto;scrollbar-width:none}
        .sidebar::-webkit-scrollbar{display:none}
        .sidebar-top{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid var(--border)}
        .sidebar-logo-icon{width:32px;height:32px;background:var(--grad);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;color:#fff;flex-shrink:0}
        .sidebar-brand{font-size:.95rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
        .sidebar-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
        .nav-link{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:var(--text2);text-decoration:none;font-size:.845rem;font-weight:500;transition:.2s;position:relative;white-space:nowrap}
        .nav-link:hover{background:rgba(255,255,255,.05);color:var(--text)}
        .nav-link.active{background:rgba(14,165,233,.14);color:var(--accent);font-weight:600}
        .nav-link.active::before{content:'';position:absolute;left:0;top:20%;height:60%;width:3px;background:var(--accent);border-radius:0 3px 3px 0}
        .nav-link i{width:16px;text-align:center;font-size:.9rem;flex-shrink:0}
        .nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:.62rem;font-weight:700;padding:2px 6px;border-radius:50px}
        .sidebar-divider{height:1px;background:var(--border);margin:6px 10px}
        .sidebar-footer{padding:12px 10px;border-top:1px solid var(--border)}
        .sidebar-user{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:.2s}
        .sidebar-user:hover{background:rgba(255,255,255,.05)}
        .sidebar-avatar{width:32px;height:32px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:#fff;flex-shrink:0}
        .sidebar-uname{font-size:.8rem;font-weight:600;color:var(--text)}
        .sidebar-urole{font-size:.7rem;color:var(--text3)}
        .sidebar-logout{display:flex;align-items:center;gap:11px;padding:9px 12px;color:var(--danger);background:none;border:none;border-radius:8px;font-size:.845rem;font-weight:500;cursor:pointer;width:100%;transition:.2s;font-family:'Inter',sans-serif;margin-top:4px}
        .sidebar-logout:hover{background:rgba(239,68,68,.08)}
        .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99;backdrop-filter:blur(2px)}
        .main-wrap{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh;min-width:0}
        .top-header{height:var(--header-h);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:50;gap:16px}
        .header-left{display:flex;align-items:center;gap:14px}
        .hamburger-mob{display:none;width:34px;height:34px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;color:var(--text2);cursor:pointer;align-items:center;justify-content:center;font-size:.95rem;transition:.2s}
        .header-title h1{font-size:1.1rem;font-weight:700}
        .header-title p{font-size:.73rem;color:var(--text2);margin-top:1px}
        .header-right{display:flex;align-items:center;gap:10px}
        .header-search{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:7px 14px;min-width:200px}
        .header-search input{background:none;border:none;outline:none;color:var(--text);font-family:'Inter',sans-serif;font-size:.82rem;width:100%}
        .header-search input::placeholder{color:var(--text3)}
        .header-search i{color:var(--text3);font-size:.8rem}
        .header-icon-btn{width:34px;height:34px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.88rem;transition:.2s;position:relative}
        .header-icon-btn:hover{background:rgba(14,165,233,.1);color:var(--accent)}
        .notif-dot{position:absolute;top:1px;right:1px;width:8px;height:8px;background:var(--danger);border-radius:50%;border:2px solid var(--bg2)}
        .header-user-pill{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:50px;padding:4px 12px 4px 4px;cursor:pointer}
        .header-user-pill span{font-size:.8rem;font-weight:600}
        .content{padding:24px;flex:1}
        .mini-stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
        .mini-stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;align-items:center;gap:14px;transition:.2s}
        .mini-stat:hover{border-color:rgba(14,165,233,.2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
        .mini-ico{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex-shrink:0}
        .ico-blue{background:rgba(14,165,233,.12);color:var(--accent)}
        .ico-yellow{background:rgba(245,158,11,.12);color:var(--warning)}
        .ico-green{background:rgba(16,185,129,.12);color:var(--success)}
        .ico-cyan{background:rgba(6,182,212,.12);color:#06b6d4}
        .mini-val{font-size:1.5rem;font-weight:800;color:var(--text);line-height:1}
        .mini-label{font-size:.72rem;color:var(--text2);margin-top:2px}
        .mini-change{font-size:.68rem;font-weight:600;margin-top:3px;color:var(--success)}
        .mini-change.warn{color:var(--warning)}
        .dash-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:18px}
        .dash-card:last-child{margin-bottom:0}
        .dash-card-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
        .dash-card-title{font-size:.88rem;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
        .dash-card-title i{color:var(--accent);font-size:.82rem}
        .dash-card-action{font-size:.72rem;color:var(--accent);text-decoration:none;font-weight:600;padding:4px 10px;border-radius:50px;border:1px solid rgba(14,165,233,.25);background:rgba(14,165,233,.08);transition:.2s}
        .dash-card-action:hover{background:var(--accent);color:#fff}
        .two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
        .dash-table{width:100%;border-collapse:collapse;font-size:.82rem}
        .dash-table th{text-align:left;padding:10px 20px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);background:rgba(255,255,255,.02);border-bottom:1px solid var(--border);white-space:nowrap}
        .dash-table td{padding:12px 20px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text2);vertical-align:middle}
        .dash-table tr:last-child td{border-bottom:none}
        .dash-table tr:hover td{background:rgba(255,255,255,.02)}
        .user-cell{display:flex;align-items:center;gap:10px}
        .ua{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.68rem;color:#fff;flex-shrink:0}
        .ua-blue{background:var(--grad)}.ua-green{background:linear-gradient(135deg,#10b981,#059669)}.ua-purple{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}.ua-orange{background:linear-gradient(135deg,#f59e0b,#d97706)}.ua-pink{background:linear-gradient(135deg,#ec4899,#be185d)}
        .td-name{font-weight:600;color:var(--text);font-size:.84rem}.td-sub{font-size:.7rem;color:var(--text3)}
        .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:50px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
        .badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
        .badge-active{background:rgba(16,185,129,.1);color:var(--success);border:1px solid rgba(16,185,129,.2)}
        .badge-new{background:rgba(14,165,233,.1);color:var(--accent);border:1px solid rgba(14,165,233,.2)}
        .badge-confirmed{background:rgba(6,182,212,.1);color:#06b6d4;border:1px solid rgba(6,182,212,.2)}
        .badge-completed{background:rgba(16,185,129,.1);color:var(--success);border:1px solid rgba(16,185,129,.2)}
        .badge-pending{background:rgba(245,158,11,.1);color:var(--warning);border:1px solid rgba(245,158,11,.2)}
        .badge-cancelled{background:rgba(239,68,68,.1);color:var(--danger);border:1px solid rgba(239,68,68,.2)}
        .badge-inactive{background:rgba(100,116,139,.1);color:var(--text3);border:1px solid rgba(100,116,139,.2)}
        .btn-sm{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:6px;font-size:.72rem;font-weight:600;cursor:pointer;border:none;transition:.2s;font-family:'Inter',sans-serif}
        .btn-outline-sm{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text2)}
        .btn-outline-sm:hover{border-color:var(--accent);color:var(--accent);background:rgba(14,165,233,.08)}
        .btn-danger-sm{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:var(--danger)}
        .btn-danger-sm:hover{background:var(--danger);color:#fff}
        .btn-success-sm{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);color:var(--success)}
        .btn-success-sm:hover{background:var(--success);color:#fff}
        .act-list{display:flex;flex-direction:column}
        .act-item{display:flex;gap:10px;align-items:flex-start;padding:12px 20px;border-bottom:1px solid rgba(255,255,255,.04)}
        .act-item:last-child{border-bottom:none}
        .act-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:5px;flex-shrink:0}
        .act-dot.g{background:var(--success)}.act-dot.y{background:var(--warning)}.act-dot.r{background:var(--danger)}
        .act-text{font-size:.82rem;color:var(--text2);line-height:1.5;flex:1}
        .act-text strong{color:var(--text);font-weight:600}
        .act-time{font-size:.7rem;color:var(--text3);margin-top:2px}
        @media(max-width:900px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0);box-shadow:8px 0 40px rgba(0,0,0,.4)}.sidebar-overlay.active{display:block}.main-wrap{margin-left:0}.hamburger-mob{display:flex}.header-search{display:none}.content{padding:16px}.mini-stat-row{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}}
        @media(max-width:600px){.mini-stat-row{grid-template-columns:1fr 1fr}}
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:20px}
        .modal-overlay.active{display:flex}
        .modal-box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;position:relative}
        .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
        .modal-title{font-size:1.05rem;font-weight:700;color:var(--text)}
        .modal-close{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.9rem;transition:.2s}
        .modal-close:hover{background:rgba(239,68,68,.1);color:var(--danger);border-color:rgba(239,68,68,.3)}
        .form-group{margin-bottom:14px}
        .form-label{display:block;font-size:.78rem;font-weight:600;color:var(--text2);margin-bottom:6px}
        .form-input,.form-select,.form-textarea{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:.85rem}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .btn-primary{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;background:var(--grad);color:#fff;border:none;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
        .btn-primary:disabled{opacity:.6;cursor:not-allowed}
    </style>
</head>
<body>
<script src="../js/theme.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/dashboard-hospital-jobs.js"></script>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<aside class="sidebar" id="dashSidebar">
    <div class="sidebar-top">
        <div class="sidebar-logo-icon">DC</div>
        <span class="sidebar-brand">Doctors Coat</span>
    </div>
    <nav class="sidebar-nav">
        <a href="dashboard-hospital.html" class="nav-link"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        <a href="dashboard-hospital-doctors.html" class="nav-link"><i class="fa-solid fa-user-doctor"></i> Doctors</a>
        <a href="dashboard-hospital-jobs.html" class="nav-link active"><i class="fa-solid fa-briefcase-medical"></i> Job Listings</a>
        <a href="dashboard-hospital-applications.html" class="nav-link"><i class="fa-solid fa-file-user"></i> Applications</a>
        <a href="dashboard-hospital-appointments.html" class="nav-link"><i class="fa-solid fa-calendar-check"></i> Appointments</a>
        <a href="dashboard-hospital-reports.html" class="nav-link"><i class="fa-solid fa-chart-line"></i> Reports</a>
        <a href="dashboard-hospital-profile.html" class="nav-link"><i class="fa-solid fa-building-columns"></i> Hospital Profile</a>
        <a href="dashboard-hospital-settings.html" class="nav-link"><i class="fa-solid fa-gear"></i> Settings</a>
    </nav>
    <div class="sidebar-divider"></div>
    <div class="sidebar-footer">
        <div class="sidebar-user">
            <div class="sidebar-avatar" style="background:linear-gradient(135deg,#10b981,#059669)" data-user-avatar>AH</div>
            <div>
                <div class="sidebar-uname" data-user-name>Hospital</div>
                <div class="sidebar-urole">Hospital Admin</div>
            </div>
        </div>
        <button class="sidebar-logout" data-logout><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>
</aside>

<div class="main-wrap">
    <header class="top-header">
        <div class="header-left">
            <button class="hamburger-mob" id="hamburgerBtn"><i class="fa-solid fa-bars"></i></button>
            <div class="header-title">
                <h1>Job Listings</h1>
                <p id="dashDate">Loading…</p>
            </div>
        </div>
        <div class="header-right">
            <div class="header-icon-btn"><i class="fa-solid fa-bell"></i><div class="notif-dot"></div></div>
            <div class="header-user-pill">
                <div class="sidebar-avatar" style="width:26px;height:26px;font-size:.65rem;background:linear-gradient(135deg,#10b981,#059669)" data-user-avatar>AH</div>
                <span data-user-name>Hospital</span>
            </div>
        </div>
    </header>

    <div class="content">

            <div class="dash-card">
                <div class="dash-card-header">
                    <div class="dash-card-title"><i class="fa-solid fa-briefcase-medical"></i> Job Listings</div>
                    <button id="createJobBtn" style="background:var(--accent);color:#fff;border:none;padding:5px 15px;border-radius:50px;cursor:pointer;font-size:0.8rem;font-weight:bold;">+ Post a New Job</button>
                </div>
                <div style="padding:15px;display:flex;gap:10px;border-bottom:1px solid var(--border);">
                    <input type="text" id="jobSearchInput" placeholder="Search jobs by title, specialization, location…" style="flex:1;padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);">
                    <select id="jobStatusFilter" style="padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);">
                        <option value="">All Statuses</option><option value="active">Active</option><option value="draft">Draft</option><option value="closed">Closed</option>
                    </select>
                </div>
                <div style="padding:0;">
                    <table class="dash-table" style="width:100%;border-collapse:collapse;font-size:0.9rem;">
                        <thead><tr style="text-align:left;border-bottom:1px solid var(--border);color:var(--text3);"><th style="padding:15px;">Position</th><th>Type</th><th>Posted</th><th>Applicants</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody id="jobsTbody">
                            <tr><td colspan="6" style="text-align:center;padding:30px"><i class="fa-solid fa-spinner fa-spin" style="color:var(--accent)"></i></td></tr>
                        </tbody>
                    </table>
                </div>
                <div id="jobsPagination" style="display:flex;gap:8px;justify-content:center;padding:16px"></div>
            </div>
</div>
</div>

<!-- Job Create/Edit Modal -->
<div class="modal-overlay" id="jobModal">
    <div class="modal-box">
        <div class="modal-header">
            <span class="modal-title" id="jobModalTitle">Post New Job</span>
            <button class="modal-close" id="closeJobModal"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form id="jobForm">
            <input type="hidden" id="jobId" />
            <div class="form-row">
                <div class="form-group"><label class="form-label">Job Title</label><input class="form-input" type="text" id="jobTitle" required /></div>
                <div class="form-group"><label class="form-label">Specialization</label><input class="form-input" type="text" id="jobSpec" required /></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label class="form-label">Type</label>
                    <select class="form-select" id="jobType">
                        <option>Full-Time</option><option>Part-Time</option><option>Contract</option><option>Locum</option>
                    </select>
                </div>
                <div class="form-group"><label class="form-label">Status</label>
                    <select class="form-select" id="jobStatus">
                        <option value="active">Active (visible to doctors &amp; public)</option><option value="draft">Draft (hidden, save for later)</option><option value="closed">Closed</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group"><label class="form-label">Experience Required</label><input class="form-input" type="text" id="jobExp" placeholder="e.g. 5+ years" required /></div>
                <div class="form-group"><label class="form-label">Qualification</label><input class="form-input" type="text" id="jobQual" placeholder="e.g. MD, DM" required /></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label class="form-label">Salary</label><input class="form-input" type="text" id="jobSalary" placeholder="e.g. ₹15-25 LPA" /></div>
                <div class="form-group"><label class="form-label">Location</label><input class="form-input" type="text" id="jobLoc" required /></div>
            </div>
            <div class="form-group"><label class="form-label">Description</label><textarea class="form-textarea" id="jobDesc" rows="4"></textarea></div>
            <button type="submit" class="btn-primary" style="width:100%;justify-content:center"><i class="fa-solid fa-save"></i> Save Job</button>
        </form>
    </div>
</div>

</body>
</html>
